name: Styles check

on:
  push:
    branches:
      - main
      - 'stable/**'
    paths:
      # Black checks Python throughout the repo; Pylint/mypy check qward and tests.
      - '**/*.py'
      - 'qward/VERSION.txt'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'requirements.qward.txt'
      - 'tox.ini'
      - '.pylintrc'
      - '.pylintdict'
      - 'mypy.ini'
      - '.gitignore'
      - '.github/workflows/lint.yml'
  pull_request:
    branches:
      - main
      - 'stable/**'
    paths:
      - '**/*.py'
      - 'qward/VERSION.txt'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'requirements.qward.txt'
      - 'tox.ini'
      - '.pylintrc'
      - '.pylintdict'
      - 'mypy.ini'
      - '.gitignore'
      - '.github/workflows/lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Run styles check
        run: uvx tox -elint
