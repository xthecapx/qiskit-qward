name: Code coverage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'stable/**'
    paths:
      - 'qward/**/*.py'
      - 'qward/VERSION.txt'
      - 'tests/**'
      - '!tests/**/*.md'
      # Keep the suite inputs aligned with test_latest_versions.yml.
      - 'qward/examples/papers/*/plans/*-w*.json'
      - 'qward/examples/papers/shor/plans/shor-growth-profile.json'
      - 'qward/examples/papers/run_campaign.sh'
      - 'scripts/ibm_campaign_ci.py'
      - 'dashboard/build.py'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'requirements.qward.txt'
      - 'tox.ini'
      - '.coveragerc'
      - '.github/workflows/coverage.yml'

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv
      - name: Run coverage
        run: uvx tox -ecoverage
      - name: Convert to lcov
        run: uvx --with "coverage<7" coveragepy-lcov --output_file_path coveralls.info
      - name: Upload report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coveralls.info
          format: lcov
