name: Build and deploy sphinx docs

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'stable/**'
    paths:
      - 'docs/**'
      # API pages import library code, but do not import the research examples.
      - 'qward/**/*.py'
      - '!qward/examples/**'
      - 'qward/VERSION.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'requirements.qward.txt'
      - 'requirements.docs.txt'
      - 'tox.ini'
      - '.github/workflows/docs.yml'

jobs:
  build_and_deploy_docs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Build docs
        run: |
          uvx tox -edocs
      - name: Copy slides into docs output
        run: |
          cp -r docs/slides ./docs/_build/html/slides
      - name: Deploy docs
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html/
